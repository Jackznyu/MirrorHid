name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH release tag to publish
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Verify release tag and version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'Release tag must be an existing vMAJOR.MINOR.PATCH tag.'
          }
          $tagCommit = git rev-parse --verify "refs/tags/$($env:RELEASE_TAG)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag does not exist.' }
          $headCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $headCommit -ne $tagCommit) {
            throw 'Checked-out source does not match the requested release tag.'
          }
          "version=$($env:RELEASE_TAG.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Publish self-contained Windows build
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish .\src\MirrorHid.App\MirrorHid.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            "-p:Version=$env:RELEASE_VERSION" `
            --output .\artifacts\publish
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed.' }
          Copy-Item .\README.md, .\LICENSE .\artifacts\publish\
          Compress-Archive `
            -Path .\artifacts\publish\* `
            -DestinationPath .\artifacts\MirrorHid-win-x64.zip

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $asset = ".\artifacts\MirrorHid-win-x64.zip#MirrorHid for Windows x64"
          gh release view $env:RELEASE_TAG *> $null

          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $asset --clobber
          } else {
            gh release create $env:RELEASE_TAG $asset --verify-tag --generate-notes
          }
