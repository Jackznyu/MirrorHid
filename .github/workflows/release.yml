name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Publish self-contained Windows build
        shell: pwsh
        run: |
          dotnet publish .\src\MirrorHid.App\MirrorHid.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output .\artifacts\publish
          Copy-Item .\README.md, .\LICENSE .\artifacts\publish\
          Compress-Archive `
            -Path .\artifacts\publish\* `
            -DestinationPath .\artifacts\MirrorHid-win-x64.zip

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            ".\artifacts\MirrorHid-win-x64.zip#MirrorHid for Windows x64" `
            --verify-tag `
            --generate-notes
