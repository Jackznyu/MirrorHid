name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or new release tag to publish
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Publish self-contained Windows build
        shell: pwsh
        run: |
          dotnet publish .\src\MirrorHid.App\MirrorHid.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output .\artifacts\publish
          Copy-Item .\README.md, .\LICENSE .\artifacts\publish\
          Compress-Archive `
            -Path .\artifacts\publish\* `
            -DestinationPath .\artifacts\MirrorHid-win-x64.zip

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $asset = ".\artifacts\MirrorHid-win-x64.zip#MirrorHid for Windows x64"
          gh release view $env:RELEASE_TAG *> $null

          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $asset --clobber
          } else {
            gh release create $env:RELEASE_TAG $asset --verify-tag --generate-notes
          }
