name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Build release configuration
        run: dotnet build .\src\MirrorHid.App\MirrorHid.App.csproj --configuration Release

      - name: Run regression checks without Bluetooth hardware
        run: dotnet run --project .\tests\MirrorHid.RegressionTests\MirrorHid.RegressionTests.csproj --configuration Release

      - name: Check release tag validation
        shell: pwsh
        run: .\tests\Test-ReleaseWorkflow.ps1
